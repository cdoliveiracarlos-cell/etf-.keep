<style>
  :root{
    --bg:#0d1421; --card:#151c2c; --card2:#1b2438; --line:#222d44;
    --txt:#eef2f8; --sub:#7d8aa5; --up:#16c784; --down:#ea3943;
    --accent:#e8442e; --accent2:#f0a13c;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:linear-gradient(150deg,#11182a 0%,#0d1421 55%,#141a2e 100%);
    color:var(--txt); font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    min-height:100vh; padding:14px; max-width:520px; margin:0 auto;
  }
  /* ---------- header ---------- */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:17px;color:#fff;
  }
  .brand h1{font-size:21px;font-weight:800;letter-spacing:-.3px}
  .updated{font-size:12px;color:var(--sub);margin:2px 0 12px 44px;display:flex;gap:7px;align-items:center}
  .updated button{background:none;border:none;color:var(--sub);font-size:14px;cursor:pointer}
  .iconbtn{
    background:var(--card2);border:1px solid var(--line);color:var(--txt);
    width:34px;height:34px;border-radius:9px;font-size:18px;cursor:pointer;
  }
  /* ---------- table ---------- */
  .cols{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);
    padding:6px 4px;border-bottom:1px solid var(--line)}
  .cols span:nth-child(2){margin-left:auto;margin-right:74px}
  #list .row{
    display:flex;align-items:center;gap:11px;padding:13px 4px;
    border-bottom:1px solid var(--line);cursor:pointer;
  }
  #list .row:active{background:var(--card2)}
  .icon{
    width:40px;height:40px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:#fff;
  }
  .nm{min-width:0}
  .nm b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .nm span{font-size:12.5px;color:var(--sub)}
  .px{margin-left:auto;text-align:right;flex:none}
  .px b{font-size:16px;display:block}
  .px span{font-size:13px;font-weight:700}
  .pos{color:var(--up)} .neg{color:var(--down)}
  svg.spark{flex:none;width:64px;height:36px}
  /* ---------- settings panel ---------- */
  .panel{
    position:fixed;inset:0;background:rgba(8,12,22,.72);backdrop-filter:blur(3px);
    display:none;align-items:flex-end;z-index:9;
  }
  .panel.open{display:flex}
  .sheet{
    background:var(--card);width:100%;max-width:520px;margin:0 auto;
    border-radius:18px 18px 0 0;padding:18px 16px 26px;max-height:75vh;overflow:auto;
  }
  .sheet h2{font-size:16px;margin-bottom:4px}
  .sheet p{font-size:12.5px;color:var(--sub);margin-bottom:14px}
  .chk{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:15px}
  .chk input{width:19px;height:19px;accent-color:var(--accent)}
  .chk .tk{color:var(--sub);font-size:12.5px;margin-left:auto}
  /* ---------- detail view ---------- */
  #detail{display:none}
  .back{background:none;border:none;color:var(--sub);font-size:15px;cursor:pointer;padding:6px 0;margin-bottom:6px}
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .dhead .icon{width:46px;height:46px;font-size:12px}
  .dhead h2{font-size:20px}
  .dhead span{font-size:13px;color:var(--sub)}
  .bigpx{font-size:32px;font-weight:800;letter-spacing:-.5px}
  .bigchg{font-size:15px;font-weight:700;margin:2px 0 10px}
  .periodchg{
    display:flex;justify-content:space-between;align-items:baseline;
    background:var(--card2);border:1px solid var(--line);border-radius:10px;
    padding:9px 13px;margin-bottom:6px;font-size:13px;color:var(--sub);
  }
  .periodchg b{font-size:18px;font-weight:800}
  .perf{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 18px;
  }
  .perf .cell{
    background:var(--card2);border:1px solid var(--line);border-radius:11px;
    padding:9px 6px;text-align:center;
  }
  .perf .cell em{display:block;font-style:normal;font-size:11px;color:var(--sub);margin-bottom:3px}
  .perf .cell b{font-size:14px}
  .meta{font-size:13px;color:var(--sub);line-height:1.9}
  .meta b{color:var(--txt);float:right}
  #bigchart{width:100%;height:190px;margin:6px 0 4px}
  .ranges{display:flex;gap:6px;margin-bottom:14px}
  .ranges button{
    flex:1;background:var(--card2);border:1px solid var(--line);color:var(--sub);
    border-radius:8px;padding:7px 0;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .ranges button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .note{font-size:11px;color:#54617c;text-align:center;margin-top:18px}
</style>

const LS='satrix.sel';
const LSURL='satrix.feed';
let sel = JSON.parse(localStorage.getItem(LS)||'null') || ['STX40','STX500','STXNDQ','STXWDM'];
let cur=null, curRange='1M', liveOK=false;

// ---- live feed: published Google Sheet CSV ----
// expected columns: ticker,price,d,1W,1M,3M,6M,1Y,3Y,5Y
async function loadLive(){
  const url=localStorage.getItem(LSURL);
  const stat=document.getElementById('feedStat');
  if(!url){ if(stat&&document.getElementById('panel').classList.contains('open')){stat.textContent='Not connected — showing demo data';stat.style.color='var(--accent)';} return; }
  document.getElementById('ts').textContent='syncing…';
  try{
    const r=await fetch(url,{cache:'no-store'});
    const txt=await r.text();
    const lines=txt.trim().split(/\r?\n/).slice(1);
    let hits=0;
    for(const ln of lines){
      const c=ln.split(',').map(s=>s.replace(/^"|"$/g,'').trim());
      const f=FUNDS.find(x=>x.t===c[0].toUpperCase());
      if(!f) continue;
      const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
      if(num(c[1])!==null) f.px=num(c[1]);
      if(num(c[2])!==null) f.d=num(c[2]);
      ['1W','1M','3M','6M','1Y','3Y','5Y'].forEach((k,i)=>{ if(num(c[3+i])!==null) f.perf[k]=num(c[3+i]); });
      hits++;
    }
    liveOK=hits>0;
    if(stat){stat.textContent=liveOK?`Connected — ${hits} funds synced`:'Connected but no matching tickers found';stat.style.color=liveOK?'var(--up)':'var(--accent)';}
  }catch(e){
    liveOK=false;
    if(stat){stat.textContent='Could not reach the sheet — check the URL is the published CSV link';stat.style.color='var(--down)';}
  }
  renderList();
  if(cur && document.getElementById('detail').style.display==='block') openDetail(cur.t);
}
function setFeed(){
  const u=(document.getElementById('feedUrl').value||'').trim();
  if(u) localStorage.setItem(LSURL,u); else localStorage.removeItem(LSURL);
  document.getElementById('feedStat').textContent='Connecting…';
  loadLive();
}

// deterministic pseudo series per fund+range
function series(f,n,trendPct){
  let s=[],v=100,seed=f.t.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280-.5};
  const drift=trendPct/100/n;
  for(let i=0;i<n;i++){v*=1+drift+rnd()*0.012;s.push(v)}
  return s;
}
function spark(s,w,h,color){
  const mn=Math.min(...s),mx=Math.max(...s),r=mx-mn||1;
  const pts=s.map((v,i)=>`${(i/(s.length-1)*w).toFixed(1)},${(h-2-(v-mn)/r*(h-4)).toFixed(1)}`).join(' ');
  return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"/>`;
}
function fmtP(f){const v=f.px;const sym=f.ccy==='USD'?'$':'R';
  return sym+v.toLocaleString('en-ZA',{minimumFractionDigits:v<1000?2:0,maximumFractionDigits:v<1000?2:0});}
function tick(f){return f.t.startsWith('STX')?f.t.replace('STX','')||'40':f.t.slice(0,4);}
function chg(v){const c=v>=0?'pos':'neg',a=v>=0?'&#9650;':'&#9660;';return `<span class="${c}">${Math.abs(v).toFixed(1)}% ${a}</span>`;}

// ---------------- DASHBOARD ----------------
function renderList(){
  document.getElementById('list').innerHTML = FUNDS.filter(f=>sel.includes(f.t)).map(f=>{
    const s=series(f,30,f.perf['1W']*1.5);
    const col=f.perf['1W']>=0?'var(--up)':'var(--down)';
    return `<div class="row" onclick="openDetail('${f.t}')">
      <div class="icon" style="background:${f.c}">${tick(f)}</div>
      <div class="nm"><b>${f.n}</b><span>${f.t}</span></div>
      <div class="px"><b>${fmtP(f)}</b>${chg(f.d)}</div>
      <svg class="spark" viewBox="0 0 64 36" preserveAspectRatio="none">${spark(s,64,36,col)}</svg>
    </div>`;
  }).join('');
  document.getElementById('ts').textContent=new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
  document.querySelector('.note').innerHTML=liveOK
    ?'Live via Google Sheets &middot; <a href="#" onclick="openPanel();return false" style="color:#7d8aa5">settings</a>'
    :'Demo data &middot; <a href="#" onclick="openPanel();return false" style="color:#e8442e">connect live feed</a>';
}
function refresh(){loadLive();renderList();}

// ---------------- SELECTOR ----------------
function openPanel(){
  const row=f=>`<label class="chk"><input type="checkbox" ${sel.includes(f.t)?'checked':''} onchange="toggle('${f.t}',this.checked)">
    ${f.n}<span class="tk">${f.t}</span></label>`;
  const jse=FUNDS.filter(f=>f.ccy!=='USD'),usd=FUNDS.filter(f=>f.ccy==='USD');
  document.getElementById('chkList').innerHTML=
    `<div style="font-size:12px;color:var(--sub);font-weight:700;margin:6px 0 2px">JSE · ZAR</div>`+jse.map(row).join('')+
    `<div style="font-size:12px;color:var(--sub);font-weight:700;margin:14px 0 2px">US · USD</div>`+usd.map(row).join('');
  document.getElementById('feedUrl').value=localStorage.getItem(LSURL)||'';
  document.getElementById('feedStat').textContent=liveOK?'Connected — live data active':'Not connected — showing demo data';
  document.getElementById('feedStat').style.color=liveOK?'var(--up)':'var(--accent)';
  document.getElementById('panel').classList.add('open');
}
function closePanel(){document.getElementById('panel').classList.remove('open');renderList();}
function toggle(t,on){ sel=on?[...sel,t]:sel.filter(x=>x!==t); localStorage.setItem(LS,JSON.stringify(sel)); }

// ---------------- DETAIL ----------------
const RANGES={'1D':24,'1W':14,'1M':30,'3M':60,'6M':90,'1Y':120,'3Y':150,'5Y':180};
function perfFor(f,r){return r==='1D'?f.d:(f.perf[r]||0);}
function openDetail(t){
  cur=FUNDS.find(f=>f.t===t);
  document.getElementById('dash').style.display='none';
  document.getElementById('detail').style.display='block';
  const i=document.getElementById('dIcon'); i.style.background=cur.c; i.textContent=tick(cur);
  document.getElementById('dName').textContent=cur.n;
  document.getElementById('dTicker').textContent=cur.t+(cur.ccy==='USD'?' · US':' · JSE');
  document.getElementById('dPrice').textContent=fmtP(cur);
  document.getElementById('dChg').innerHTML=chg(cur.d)+' <span style="color:var(--sub);font-weight:400">today</span>';
  document.getElementById('perfGrid').innerHTML=
    `<div class="cell"><em>1D</em><b class="${cur.d>=0?'pos':'neg'}">${cur.d>0?'+':''}${cur.d.toFixed(1)}%</b></div>`
    +Object.entries(cur.perf).map(([k,v])=>
    `<div class="cell"><em>${k}</em><b class="${v>=0?'pos':'neg'}">${v>0?'+':''}${v.toFixed(1)}%</b></div>`).join('')
    +`<div class="cell"><em>TER</em><b>${cur.ter.toFixed(2)}%</b></div>`;
  document.getElementById('dMeta').innerHTML=
    `Fund size <b>${cur.aum}</b><br>Total expense ratio <b>${cur.ter.toFixed(2)}%</b><br>Exchange <b>${cur.ccy==='USD'?'NYSE/Nasdaq':'JSE'}</b><br>Currency <b>${cur.ccy||'ZAR'}</b>`;
  setRange(curRange);
  window.scrollTo(0,0);
}
function setRange(r){
  curRange=r;
  document.getElementById('ranges').innerHTML=Object.keys(RANGES).map(k=>
    `<button class="${k===r?'on':''}" onclick="setRange('${k}')">${k}</button>`).join('');
  const p=perfFor(cur,r);
  document.getElementById('dPeriod').innerHTML=
    `<span>${r==='1D'?'24h':r} growth</span><b class="${p>=0?'pos':'neg'}">${p>0?'+':''}${p.toFixed(1)}%</b>`;
  const s=series(cur,RANGES[r],p);
  const col=p>=0?'#16c784':'#ea3943';
  const svg=document.getElementById('bigchart');
  const w=svg.clientWidth||480,h=190;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const mn=Math.min(...s),mx=Math.max(...s),rg=mx-mn||1;
  const pts=s.map((v,i)=>`${(i/(s.length-1)*w).toFixed(1)},${(h-6-(v-mn)/rg*(h-12)).toFixed(1)}`);
  // grid: 4 horizontal + 4 vertical lines, with % labels relative to period start
  let grid='';
  for(let g=0;g<=4;g++){
    const y=6+(h-12)*g/4;
    const val=mx-rg*g/4;
    const pct=((val/s[0])-1)*100;
    grid+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#222d44" stroke-width="1"/>`;
    grid+=`<text x="${w-3}" y="${y-3}" font-size="9" fill="#54617c" text-anchor="end">${pct>0?'+':''}${pct.toFixed(1)}%</text>`;
  }
  for(let g=1;g<4;g++){
    const x=w*g/4;
    grid+=`<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="#222d44" stroke-width="1" stroke-dasharray="3,4"/>`;
  }
  svg.innerHTML=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".25"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <polygon points="0,${h} ${pts.join(' ')} ${w},${h}" fill="url(#g)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2"/>`;
}
function showDash(){document.getElementById('detail').style.display='none';document.getElementById('dash').style.display='block';renderList();}

renderList();
loadLive();
setInterval(loadLive,5*60*1000); // refresh every 5 min
</script>
