<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;transition:background .4s}
  .wrap{max-width:520px;margin:0 auto;padding:12px}
  .hdr{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;flex:none}
  .hdr h1{font-size:20px;font-weight:800}
  .plus{margin-left:auto;font-size:22px;cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;flex:none}
  .upd{font-size:12px;margin:2px 0 6px 44px;display:flex;align-items:center;gap:7px}
  .upd button{background:none;border:none;font-size:15px;cursor:pointer}
  .sortbar{display:flex;align-items:center;gap:7px;margin:6px 0 12px}
  .sortbar .lbl{font-size:12px;flex:none}
  .sortscroll{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .sortscroll button{flex:none;padding:6px 11px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid}
  .cols{display:flex;justify-content:space-between;font-size:12px;padding:4px 4px;margin-bottom:2px}
  .cols span:nth-child(2){margin-left:auto;margin-right:66px}
  .row{display:flex;align-items:center;gap:10px;padding:13px;cursor:pointer;transition:transform .15s}
  .row:active{transform:scale(.985)}
  .rank{width:18px;text-align:center;font-weight:800;font-size:13px;flex:none}
  .ic{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;color:#fff}
  .nm{min-width:0;flex:1}
  .nm b{font-weight:700;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nm span{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .px{margin-left:8px;text-align:right;flex:none;align-self:flex-end;padding-bottom:1px}
  .px b{font-weight:700;font-size:15px;display:block}
  .px span{font-size:12.5px;font-weight:700}
  svg.sp{flex:none;width:52px;height:34px}
  .back{background:none;border:none;font-size:15px;cursor:pointer;padding:8px 0;margin-bottom:4px}
  .dh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .dh .ic{width:46px;height:46px}
  .dh h2{font-size:20px}
  .dh small{font-size:13px}
  .big{font-size:33px;font-weight:800;letter-spacing:-.5px}
  .bchg{font-size:15px;font-weight:700;margin:2px 0 10px}
  .pbar{display:flex;justify-content:space-between;align-items:baseline;border-radius:11px;padding:10px 14px;margin-bottom:8px;font-size:13px}
  .pbar b{font-size:19px;font-weight:800}
  #chart{width:100%;height:200px;margin:4px 0}
  .rg{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
  .rg button{flex:1;min-width:38px;border-radius:8px;padding:7px 0;font-size:12px;font-weight:700;cursor:pointer;border:1px solid}
  .pf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .pf .c{border-radius:11px;padding:9px 4px;text-align:center}
  .pf .c em{font-style:normal;display:block;font-size:11px;margin-bottom:3px}
  .pf .c b{font-size:14px}
  .hold{border-radius:12px;padding:13px;margin-bottom:16px}
  .hold h3{font-size:14px;margin-bottom:8px}
  .hold .stats{display:flex;justify-content:space-between;font-size:12px;margin-top:10px;line-height:1.8}
  .hold .stats b{display:block;font-size:15px}
  .hold .stats small{font-size:11px;opacity:.7}
  .meta{font-size:13px;line-height:1.9;margin-bottom:20px}
  .meta b{float:right}
  .panel{position:fixed;inset:0;display:none;align-items:flex-end;z-index:9}
  .panel.open{display:flex}
  .sheet{width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px 30px;max-height:84vh;overflow:auto}
  .sheet h3{font-size:16px;margin:16px 0 4px}.sheet h3:first-child{margin-top:0}
  .sheet p{font-size:12.5px;margin-bottom:10px}
  .fr{display:flex;gap:8px;margin-bottom:8px}
  .fr input,.fr select{flex:1;border-radius:9px;padding:10px 12px;font-size:13px;min-width:0;border:1px solid}
  .fr .go{flex:none;border:none;border-radius:9px;color:#fff;font-weight:700;padding:0 16px;font-size:13px;cursor:pointer}
  .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
  .themes button{border:2px solid;border-radius:11px;padding:8px 4px;cursor:pointer;font-size:12px;font-weight:700}
  .themes .sw{width:100%;height:28px;border-radius:7px;margin-bottom:5px}
  .chk{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid;font-size:15px}
  .chk input{width:19px;height:19px;flex:none}
  .chk .tk{font-size:12.5px;margin-left:auto}
  .grp{font-size:12px;font-weight:700;margin:12px 0 2px}
  .pos{color:#16c784}.neg{color:#ea3943}
  .toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(120px);padding:10px 20px;border-radius:99px;font-size:13.5px;font-weight:700;transition:transform .25s;z-index:30;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  /* bottom nav */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;max-width:520px;margin:0 auto;
    border-top:1px solid;backdrop-filter:blur(10px)}
  .nav button{flex:1;background:none;border:none;padding:10px 0 14px;cursor:pointer;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
  .nav button .ni{font-size:19px;line-height:1}
  .wrap{padding-bottom:84px}
  /* portfolio chips */
  .pfbar{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
  .pfbar button{flex:none;padding:8px 14px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid}
  .sum{border-radius:16px;padding:15px;margin-bottom:14px}
  .sum .lbl{font-size:12px;margin-bottom:3px}
  .sum .r{display:flex;justify-content:space-between;align-items:flex-end}
  .sum .big{font-size:27px;font-weight:800;letter-spacing:-.5px}
  .sum .side{text-align:right}
  .sum .side .sv{font-size:15px;font-weight:700}
  .sum .growth{font-size:13px;margin-top:2px;font-weight:700}
  .hrow{display:flex;align-items:center;gap:11px;padding:13px;border-radius:16px;margin-bottom:9px}
  .hrow .val{margin-left:auto;text-align:right}
  .hrow .val b{font-weight:700;font-size:15px;display:block}
  .hrow .val span{font-size:12.5px;font-weight:700}
  .hrow .addb{flex:none;width:30px;height:30px;border-radius:9px;border:1px solid;background:none;font-size:17px;cursor:pointer}
  .csel{display:flex;gap:8px;margin-bottom:10px}
  .csel select{flex:1;border-radius:9px;padding:10px;font-size:13px;border:1px solid;min-width:0}
  #cchart{width:100%;height:230px}
  .clegend{display:flex;gap:16px;justify-content:center;margin:8px 0 4px;font-size:12.5px;flex-wrap:wrap}
  .clegend span{display:flex;align-items:center;gap:6px}
  .cdot{width:12px;height:3px;border-radius:2px}
  .cstat{display:flex;gap:9px;margin-top:10px}
  .cstat .c{flex:1;border-radius:11px;padding:11px;text-align:center}
  .cstat em{font-style:normal;font-size:12px;display:block;margin-bottom:3px}
  .cstat b{font-size:18px;font-weight:800}
  /* modal */
  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:25;padding:20px}
  .modal.open{display:flex}
  .mbox{width:100%;max-width:360px;border-radius:16px;padding:18px}
  .mbox h3{font-size:16px;margin-bottom:12px}
  .mbox input,.mbox select{width:100%;border-radius:9px;padding:11px;font-size:14px;border:1px solid;margin-bottom:10px}
  .mbox .mbtns{display:flex;gap:8px}
  .mbox .mbtns button{flex:1;border-radius:9px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid}
</style>
</head>

// ---------------- HELPERS ----------------
function th(){return T[theme];}
function mono(){return th().mono?'font-family:ui-monospace,monospace':'';}
function toast(m){const t=document.getElementById('toast');t.style.background=th().accent;t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
function fmtP(f){const v=f.px;const s=f.ccy==='USD'?'$':'R';return s+(v||0).toLocaleString('en-ZA',{minimumFractionDigits:v<1000?2:0,maximumFractionDigits:v<1000?2:0});}
function fmtM(v,ccy){const s=ccy==='USD'?'$':'R';return s+v.toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});}
function tick(f){return f.t.startsWith('STX')?(f.t.replace('STX','')||'40'):f.t.slice(0,4);}
function perfFor(f,r){return r==='1D'?f.d:(f.perf[r]??0);}
function shownFunds(){return FUNDS.filter(f=>sel.includes(f.t));}
function rankedFunds(){const p=sortPeriod;return shownFunds().slice().sort((a,b)=>perfFor(b,p)-perfFor(a,p));}
function series(f,n,target){
  let seed=f.t.split('').reduce((a,c)=>a+c.charCodeAt(0),7);
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280-.5};
  const raw=[0];for(let i=1;i<n;i++)raw.push(raw[i-1]+rnd()*1.6);
  const err=target-raw[n-1];return raw.map((v,i)=>100+v+err*i/(n-1));
}
function toPts(s,w,h,pad){const mn=Math.min(...s),mx=Math.max(...s),r=mx-mn||1;
  return s.map((v,i)=>[+(i/(s.length-1)*w).toFixed(2),+(h-pad-(v-mn)/r*(h-pad*2)).toFixed(2)]);}
function smooth(pts){if(pts.length<3)return 'M'+pts.map(p=>p[0]+','+p[1]).join(' L');
  let d='M'+pts[0][0]+','+pts[0][1];
  for(let i=1;i<pts.length-1;i++){const xc=(pts[i][0]+pts[i+1][0])/2,yc=(pts[i][1]+pts[i+1][1])/2;d+=' Q'+pts[i][0]+','+pts[i][1]+' '+xc+','+yc;}
  const l=pts[pts.length-1];return d+' L'+l[0]+','+l[1];}

function sparkSVG(f,w,h,period){const p=period||'1W';const val=perfFor(f,p);const c=val>=0?th().up:th().dn;const s=series(f,44,val);
  const glow=th().glow===2?'filter:drop-shadow(0 0 5px '+c+')':(th().glow===1?'filter:drop-shadow(0 0 3px '+c+'88)':'');
  return '<svg class="sp" viewBox="0 0 '+w+' '+h+'" style="'+glow+'"><path d="'+smooth(toPts(s,w,h,2))+'" fill="none" stroke="'+c+'" stroke-width="'+th().sw+'" stroke-linejoin="round" stroke-linecap="round"/></svg>';}

function setRange(r){

  document.getElementById('rg').innerHTML=Object.keys(RANGES).map(k=>{const on=k===r;

  document.getElementById('pbar').innerHTML='<span style="color:'+t.sub+'">'+(r==='1D'?'24h':r)+' growth</span><b style="color:'+col+'">'+(p>0?'+':'')+p.toFixed(1)+'%</b>';
  const svg=document.getElementById('chart'),w=svg.clientWidth||480,h=200;svg.setAttribute('viewBox','0 0 '+w+' '+h);
  const s=series(f,RANGES[r],p),pts=toPts(s,w,h,8);
  let grid='';for(let g=0;g<=4;g++){const y=8+(h-16)*g/4;grid+='<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="'+t.line+'" stroke-width="1"/>';}
  for(let g=1;g<4;g++){const x=w*g/4;grid+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+h+'" stroke="'+t.line+'" stroke-width="1" stroke-dasharray="3,4"/>';}
  const d=smooth(pts),glow=t.glow===2?'filter:drop-shadow(0 0 6px '+col+')':'';
  svg.innerHTML='<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".22"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<path d="'+d+' L'+w+','+h+' L0,'+h+' Z" fill="url(#gr)"/>'+

// ---------------- PORTFOLIOS ----------------
function pxRand(f){return f.ccy==='USD'?f.px*FX:f.px;}
function fundStats(tk,contribs){
  const f=FUNDS.find(x=>x.t===tk);if(!f)return{invested:0,value:0,growth:0};
  const invested=contribs.reduce((s,c)=>s+c.amt,0);
  const units=contribs.reduce((u,c)=>{const p0=f.ccy==='USD'?c.px0*FX:c.px0;return u+(p0>0?c.amt/p0:0);},0);
  const value=units*pxRand(f);
  return {invested,value,growth:invested>0?((value/invested)-1)*100:0};
}
function portStats(p){let inv=0,val=0;for(const tk in p.hold){const s=fundStats(tk,p.hold[tk]);inv+=s.invested;val+=s.value;}return{inv,val,growth:inv>0?((val/inv)-1)*100:0};}
function randFmt(v){return 'R'+Math.round(v).toLocaleString('en-ZA');}

    +'<button onclick="editNames()" style="border-color:'+t.fieldBd+';background:'+t.field+';color:'+t.sub+'">&#9881;</button>';
  const keys=Object.keys(p.hold).filter(k=>p.hold[k]&&p.hold[k].length);
  let rows=keys.length?keys.map(tk=>{const f=FUNDS.find(x=>x.t===tk);const s=fundStats(tk,p.hold[tk]);
    return '<div class="hrow" style="background:'+t.card+';border:'+t.cardBd+';box-shadow:'+t.cardSh+'">'+
      '<div class="ic" style="background:'+f.c+';border-radius:'+t.icR+'">'+tick(f)+'</div>'+
      '<div class="nm"><b style="color:'+t.txt+';'+m+'">'+f.n+'</b><span style="color:'+t.sub+'">'+randFmt(s.invested)+' in · '+p.hold[tk].length+' deposit'+(p.hold[tk].length>1?'s':'')+'</span></div>'+
      '<div class="val"><b style="color:'+t.txt+';'+m+'">'+randFmt(s.value)+'</b><span class="'+(s.growth>=0?'pos':'neg')+'">'+(s.growth>=0?'+':'')+s.growth.toFixed(1)+'%</span></div>'+
      '<button class="addb" style="border-color:'+t.fieldBd+';color:'+t.txt+'" onclick="openDeposit(\''+tk+'\')">+</button></div>';
  }).join(''):'<div style="text-align:center;color:'+t.sub+';padding:28px 10px;font-size:14px">No holdings for '+p.name+' yet.<br>Add a fund below.</div>';
  const addFundBtn='<div style="text-align:center;margin-top:6px"><button onclick="openAddHolding()" style="background:'+t.field+';border:1px solid '+t.fieldBd+';color:'+t.txt+';padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer">+ Add a fund to '+p.name+'</button></div>';
  document.getElementById('app').innerHTML=
    '<div style="background:'+t.bg+';border-radius:22px;padding:16px;'+(theme==='aurora'?'position:relative;overflow:hidden':'')+'">'+
    (theme==='aurora'?'<div style="position:absolute;inset:0;background:radial-gradient(60% 40% at 80% 10%,#ff6ec455,transparent)"></div>':'')+
    '<div style="position:relative">'+
    '<div class="hdr"><div class="logo" style="background:'+t.logo+'">Ex</div><h1 style="color:'+t.txt+';'+m+'">Portfolios</h1></div>'+
    '<div class="pfbar" style="margin-top:12px">'+chips+'</div>'+
    '<div class="sum" style="background:'+t.card+';border:'+t.cardBd+';box-shadow:'+t.cardSh+'">'+
      '<div class="lbl" style="color:'+t.sub+'">'+p.name+' · portfolio value</div>'+
      '<div class="r"><div class="big" style="color:'+t.txt+';'+m+'">'+randFmt(ps.val)+'</div>'+
      '<div class="side"><div class="lbl" style="color:'+t.sub+'">Invested</div><div class="sv" style="color:'+t.txt+'">'+randFmt(ps.inv)+'</div>'+
      '<div class="growth '+(ps.growth>=0?'pos':'neg')+'">'+(ps.growth>=0?'+':'')+ps.growth.toFixed(1)+'% · '+(gain>=0?'+':'')+randFmt(gain)+'</div></div></div></div>'+
    rows+addFundBtn+
    '<div style="text-align:center;color:'+t.sub+';font-size:11px;margin-top:12px">Values in rand · USD funds at R'+FX.toFixed(2)+'/$ · v'+APP_VER+'</div>'+
    '</div></div>';

function editNames(){
  const t=th();
  showModal('Rename portfolios',
    portfolios.map((p,i)=>'<input id="pn'+i+'" value="'+p.name.replace(/"/g,'&quot;')+'" style="background:'+t.field+';border-color:'+t.fieldBd+';color:'+t.txt+'">').join(''),
    ()=>{portfolios.forEach((p,i)=>{const v=(document.getElementById('pn'+i).value||'').trim();if(v){p.name=v;pushName(i,v);}});savePort();toast('Names saved');return true;});
}
function pushDeposit(tk,amt,px0){
  // sync deposit to sheet if an Apps Script feed is connected (tagged by slot, so renames stay linked)
  const url=localStorage.getItem(LSURL);if(!url||!isScript(url))return;
  fetch(url+(url.includes('?')?'&':'?')+'action=deposit&slot='+pi+'&ticker='+encodeURIComponent(tk)+'&amt='+amt+'&px0='+px0,{cache:'no-store'})
    .then(()=>setTimeout(loadPortfolios,800)).catch(()=>{});
}
function pushName(slot,name){
  const url=localStorage.getItem(LSURL);if(!url||!isScript(url))return;
  fetch(url+(url.includes('?')?'&':'?')+'action=setname&slot='+slot+'&name='+encodeURIComponent(name),{cache:'no-store'}).catch(()=>{});
}
// pull all four portfolios from the sheet so every phone shows the same thing
async function loadPortfolios(){
  const url=localStorage.getItem(LSURL);if(!url||!isScript(url))return;
  try{
    const r=await fetch(url+(url.includes('?')?'&':'?')+'action=pstate',{cache:'no-store'});
    const data=JSON.parse(await r.text());
    const names=data.names||[];
    const next=[0,1,2,3].map(s=>({name:(names[s]&&names[s].trim())?names[s]:portfolios[s]?portfolios[s].name:'Portfolio '+(s+1),hold:{}}));
    (data.deposits||[]).forEach(d=>{
      const slot=parseInt(d[0]);const tk=String(d[1]||'').toUpperCase();const amt=parseFloat(d[2]);const px0=parseFloat(d[3]);const date=d[4]||'';
      if(isNaN(slot)||slot<0||slot>3||!tk||!amt)return;
      if(!next[slot].hold[tk])next[slot].hold[tk]=[];
      next[slot].hold[tk].push({amt,px0,date});
    });
    portfolios=next;savePort();
    if(section==='port')renderPort();
  }catch(e){}
}
// ---------------- COMPARE ----------------
function renderCompare(){
  const t=th(),m=mono();
  const picks=FUNDS.filter(f=>sel.includes(f.t));
  const list=picks.length>=2?picks:FUNDS;
  if(!list.find(f=>f.t===cmpA))cmpA=list[0].t;
  if(!list.find(f=>f.t===cmpB))cmpB=list[1]?list[1].t:list[0].t;
  const fa=FUNDS.find(f=>f.t===cmpA),fb=FUNDS.find(f=>f.t===cmpB);
  const opts=cur2=>list.map(f=>'<option value="'+f.t+'" '+(f.t===cur2?'selected':'')+'>'+f.n+'</option>').join('');
  const ranges=['1W','1M','3M','6M','1Y','2Y','3Y'].map(r=>'<button onclick="setCmpRange(\''+r+'\')" style="flex:1;border-radius:8px;padding:7px 0;font-size:12px;font-weight:700;cursor:pointer;border:1px solid '+(r===cmpRange?t.accent:t.fieldBd)+';background:'+(r===cmpRange?t.accent:t.field)+';color:'+(r===cmpRange?'#fff':t.sub)+'">'+r+'</button>').join('');
  const pa=perfFor(fa,cmpRange),pb=perfFor(fb,cmpRange);
  document.getElementById('app').innerHTML=
    '<div style="background:'+t.bg+';border-radius:22px;padding:16px;'+(theme==='aurora'?'position:relative;overflow:hidden':'')+'">'+
    (theme==='aurora'?'<div style="position:absolute;inset:0;background:radial-gradient(60% 40% at 80% 10%,#ff6ec455,transparent)"></div>':'')+
    '<div style="position:relative">'+
    '<div class="hdr"><div class="logo" style="background:'+t.logo+'">Ex</div><h1 style="color:'+t.txt+';'+m+'">Compare</h1></div>'+
    '<div class="csel" style="margin-top:12px"><select onchange="cmpA=this.value;render()" style="background:'+t.field+';border-color:'+t.fieldBd+';color:'+t.txt+'">'+opts(cmpA)+'</select>'+
    '<select onchange="cmpB=this.value;render()" style="background:'+t.field+';border-color:'+t.fieldBd+';color:'+t.txt+'">'+opts(cmpB)+'</select></div>'+
    '<div class="csel">'+ranges+'</div>'+
    '<div style="background:'+t.card+';border:'+t.cardBd+';box-shadow:'+t.cardSh+';border-radius:16px;padding:12px 10px 6px"><svg id="cchart"></svg>'+
    '<div class="clegend"><span style="color:'+t.sub+'"><span class="cdot" style="background:'+t.accent+'"></span>'+fa.n+'</span>'+
    '<span style="color:'+t.sub+'"><span class="cdot" style="background:#f0a13c"></span>'+fb.n+'</span></div></div>'+
    '<div class="cstat"><div class="c" style="background:'+t.cell+';border:'+t.cardBd+'"><em style="color:'+t.accent+'">'+fa.t+' · '+cmpRange+'</em><b class="'+(pa>=0?'pos':'neg')+'">'+(pa>0?'+':'')+pa.toFixed(1)+'%</b></div>'+
    '<div class="c" style="background:'+t.cell+';border:'+t.cardBd+'"><em style="color:#f0a13c">'+fb.t+' · '+cmpRange+'</em><b class="'+(pb>=0?'pos':'neg')+'">'+(pb>0?'+':'')+pb.toFixed(1)+'%</b></div></div>'+
    '<div style="text-align:center;color:'+t.sub+';font-size:11px;margin-top:12px">Both indexed to 0% at the start · v'+APP_VER+'</div>'+
    '</div></div>';
}
function setCmpRange(r){cmpRange=r;render();}
function drawCompare(){
  const svg=document.getElementById('cchart');if(!svg)return;const t=th();
  const fa=FUNDS.find(f=>f.t===cmpA),fb=FUNDS.find(f=>f.t===cmpB);
  const w=svg.clientWidth||460,h=230,pad=22;svg.setAttribute('viewBox','0 0 '+w+' '+h);
  const n=80;
  const sa=series({t:cmpA+cmpRange},n,perfFor(fa,cmpRange)).map(v=>v-100);
  const sb=series({t:cmpB+cmpRange},n,perfFor(fb,cmpRange)).map(v=>v-100);
  const all=sa.concat(sb,[0]);const mn=Math.min(...all),mx=Math.max(...all),r=mx-mn||1;
  const Y=v=>h-pad-(v-mn)/r*(h-pad*2),X=i=>pad+i/(n-1)*(w-pad*2);
  const path=s=>{let d='M'+X(0)+','+Y(s[0]);for(let i=1;i<n-1;i++){const xc=(X(i)+X(i+1))/2,yc=(Y(s[i])+Y(s[i+1]))/2;d+=' Q'+X(i)+','+Y(s[i])+' '+xc+','+yc;}return d+' L'+X(n-1)+','+Y(s[n-1]);};
  let grid='';for(let g=0;g<=3;g++){const yy=pad+(h-pad*2)*g/3,val=mx-r*g/3;
    grid+='<line x1="'+pad+'" y1="'+yy+'" x2="'+w+'" y2="'+yy+'" stroke="'+t.line+'" stroke-width="1"/>';
    grid+='<text x="2" y="'+(yy-3)+'" font-size="9" fill="'+t.sub+'">'+(val>0?'+':'')+val.toFixed(0)+'%</text>';}
  grid+='<line x1="'+pad+'" y1="'+Y(0)+'" x2="'+w+'" y2="'+Y(0)+'" stroke="'+t.sub+'" stroke-width="1" stroke-dasharray="4,4" opacity=".5"/>';
  svg.innerHTML=grid+'<path d="'+path(sa)+'" fill="none" stroke="'+t.accent+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<path d="'+path(sb)+'" fill="none" stroke="#f0a13c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
}

// ---------------- LIVE FEED ----------------
async function loadLive(){
  const url=localStorage.getItem(LSURL),stat=document.getElementById('feedStat');
  if(!url){if(stat){stat.textContent='Not connected — showing demo data';stat.style.color=th().accent;}return;}
  const tsEl=document.getElementById('ts');if(tsEl)tsEl.textContent='syncing…';
  try{
    const durl=isScript(url)?url+(url.includes('?')?'&':'?')+'action=get':url;
    const r=await fetch(durl,{cache:'no-store'});const txt=await r.text();
    const lines=txt.trim().split(/\r?\n/).slice(1);let hits=0;
    for(const ln of lines){const c=ln.split(',').map(s=>s.replace(/^"|"$/g,'').trim());
      const f=FUNDS.find(x=>x.t===c[0].toUpperCase());if(!f)continue;
      const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
      if(num(c[1])!==null)f.px=num(c[1]);if(num(c[2])!==null)f.d=num(c[2]);
      ['1W','1M','3M','6M','1Y','2Y','3Y'].forEach((k,i)=>{if(num(c[3+i])!==null)f.perf[k]=num(c[3+i]);});hits++;}
    liveOK=hits>0;if(stat){stat.textContent=liveOK?'Connected — '+hits+' funds synced':'Connected but no matching tickers';stat.style.color=liveOK?th().up:th().accent;}
  }catch(e){liveOK=false;if(stat){stat.textContent='Could not reach the sheet — check the link';stat.style.color=th().dn;}}
  if(view==='dash')renderDash();else if(cur)renderDetail();
}
async function setFeed(){
  const u=(document.getElementById('feedUrl').value||'').trim();
  if(u)localStorage.setItem(LSURL,u);else localStorage.removeItem(LSURL);
  const stat=document.getElementById('feedStat');if(stat)stat.textContent='Connecting…';toast('Feed saved');
  if(u&&isScript(u)){const all=FUNDS.map(f=>f.t+':'+(f.ccy==='USD'?'USD':'ZAR')).concat(CATALOG.map(c=>c.t+':'+(c.ccy==='USD'?'USD':'ZAR')));
    if(stat)stat.textContent='Setting up sheet — adding funds…';
    try{await fetch(u+(u.includes('?')?'&':'?')+'action=seed&tickers='+encodeURIComponent(all.join(',')),{cache:'no-store'});}catch(e){}
    // push existing local names + deposits up so nothing is lost on first connect
    portfolios.forEach((p,s)=>{pushName(s,p.name);for(const tk in p.hold){p.hold[tk].forEach(c=>{
      fetch(u+(u.includes('?')?'&':'?')+'action=deposit&slot='+s+'&ticker='+encodeURIComponent(tk)+'&amt='+c.amt+'&px0='+c.px0,{cache:'no-store'}).catch(()=>{});});}});
  }
  loadLive();loadPortfolios();
}

// ---------------- ADD / SELECT ----------------
function saveSel(){localStorage.setItem(LS,JSON.stringify(sel));}
function fillCatalog(){const have=new Set(FUNDS.map(f=>f.t));
  document.getElementById('catalogList').innerHTML=CATALOG.filter(c=>!have.has(c.t)).map(c=>'<option value="'+c.t+' — '+c.n+'">').join('');}
function addFromSearch(){
  const raw=(document.getElementById('addSearch').value||'').trim();if(!raw)return;
  const tk=raw.split('—')[0].trim().toUpperCase();
  if(FUNDS.find(f=>f.t===tk)){if(!sel.includes(tk)){sel.push(tk);saveSel();}toast(tk+' shown');renderChk();return;}
  const hit=CATALOG.find(c=>c.t===tk)||CATALOG.find(c=>c.n.toUpperCase()===raw.toUpperCase());
  if(hit){addFund(hit.t,hit.n,hit.ccy);}
  else{document.getElementById('customRow').style.display='flex';const ci=document.getElementById('custName');ci.value='';ci.placeholder='Name for '+tk;ci.dataset.tk=tk;ci.focus();}
}
function addCustom(){const ci=document.getElementById('custName'),tk=ci.dataset.tk,nm=(ci.value||tk).trim();
  const ccy=document.getElementById('custCcy').value==='USD'?'USD':undefined;addFund(tk,nm,ccy);document.getElementById('customRow').style.display='none';}
function addFund(tk,nm,ccy){
  const f={t:tk,n:nm,c:PALETTE[FUNDS.length%PALETTE.length],px:0,d:0,perf:{'1W':0,'1M':0,'3M':0,'6M':0,'1Y':0,'2Y':0,'3Y':0},ter:0,aum:'—'};
  if(ccy==='USD')f.ccy='USD';FUNDS.push(f);
  const cust=JSON.parse(localStorage.getItem(LSCUST)||'[]');cust.push(f);localStorage.setItem(LSCUST,JSON.stringify(cust));
  sel.push(tk);saveSel();document.getElementById('addSearch').value='';
  const url=localStorage.getItem(LSURL);
  if(url&&isScript(url)){toast(tk+' added — updating sheet…');
    fetch(url+(url.includes('?')?'&':'?')+'action=add&ticker='+encodeURIComponent(tk)+'&ccy='+(ccy==='USD'?'USD':'ZAR'),{cache:'no-store'}).then(()=>{toast(tk+' in sheet');loadLive();}).catch(()=>toast('Sheet update failed'));
  }else{document.getElementById('addHint').style.display='block';toast(tk+' added');}
  fillCatalog();renderChk();
}
function toggle(t2,on){sel=on?[...sel,t2]:sel.filter(x=>x!==t2);saveSel();toast(on?t2+' shown':t2+' hidden');}
function renderChk(){const t=th();
  const row=f=>'<label class="chk" style="border-color:'+t.line+';color:'+t.txt+'"><input type="checkbox" '+(sel.includes(f.t)?'checked':'')+' onchange="toggle(\''+f.t+'\',this.checked)" style="accent-color:'+t.accent+'">'+f.n+'<span class="tk" style="color:'+t.sub+'">'+f.t+'</span></label>';
  const jse=FUNDS.filter(f=>f.ccy!=='USD'),usd=FUNDS.filter(f=>f.ccy==='USD');
  document.getElementById('chkList').innerHTML='<div class="grp" style="color:'+t.sub+'">JSE · ZAR</div>'+jse.map(row).join('')+'<div class="grp" style="color:'+t.sub+'">US · USD</div>'+usd.map(row).join('');
}
function openPanel(){
  const t=th();document.getElementById('sheetBox').style.background=t.sheet;
  document.getElementById('sheetBox').innerHTML=
    '<h3 style="color:'+t.txt+'">Live data</h3>'+
    '<p style="color:'+t.sub+'">Paste your Apps Script /exec link (funds auto-add to the sheet) or a published CSV link.</p>'+
    '<div class="fr"><input id="feedUrl" type="url" placeholder="https://script.google.com/.../exec" style="background:'+t.field+';border-color:'+t.fieldBd+';color:'+t.txt+'"><button class="go" style="background:'+t.accent+'" onclick="setFeed()">Save</button></div>'+
    '<p id="feedStat" style="font-size:12.5px"></p>'+

    '<h3 style="color:'+t.txt+'">Add a fund</h3>'+
    '<p style="color:'+t.sub+'">Type a ticker from EasyEquities — Satrix, Sygnia, 1nvest, Vanguard, anything.</p>'+
    '<div class="fr"><input id="addSearch" list="catalogList" placeholder="e.g. SYG500, QQQ, STXRAF" style="background:'+t.field+';border-color:'+t.fieldBd+';color:'+t.txt+'"><button class="go" style="background:'+t.accent+'" onclick="addFromSearch()">Add</button></div>'+
    '<datalist id="catalogList"></datalist>'+
    '<div class="fr" id="customRow" style="display:none"><input id="custName" placeholder="Fund name" style="background:'+t.field+';border-color:'+t.fieldBd+';color:'+t.txt+'"><select id="custCcy" style="background:'+t.field+';border-color:'+t.fieldBd+';color:'+t.txt+'"><option value="ZAR">JSE</option><option value="USD">US</option></select><button class="go" style="background:'+t.accent+'" onclick="addCustom()">OK</button></div>'+

    '<p style="text-align:center;color:'+t.sub+';margin-top:16px;font-size:12px">ETF Watch v'+APP_VER+'</p>';
  renderThemes();fillCatalog();renderChk();
  const fu=document.getElementById('feedUrl');fu.value=localStorage.getItem(LSURL)||'';
  const st=document.getElementById('feedStat');st.textContent=liveOK?'Connected — live data active':'Not connected — showing demo data';st.style.color=liveOK?t.up:t.accent;
  document.getElementById('panel').style.background='rgba(6,10,20,.72)';
  document.getElementById('panel').classList.add('open');history.pushState({v:'panel'},'');
}
function renderThemes(){const t=th();
  document.getElementById('themes').innerHTML=Object.keys(T).map(k=>{const on=k===theme;
    return '<button onclick="setTheme(\''+k+'\',true)" style="border-color:'+(on?t.accent:t.fieldBd)+';background:'+t.field+';color:'+t.txt+'"><div class="sw" style="background:'+T[k].bg+'"></div>'+TNAMES[k]+'</button>';}).join('');}
function closePanel(fromPop){document.getElementById('panel').classList.remove('open');
  if(!fromPop&&history.state&&history.state.v==='panel')history.back();render();}

function goBack(){history.back();}
window.addEventListener('popstate',function(){
  if(document.getElementById('modal').classList.contains('open')){closeModal(true);return;}
